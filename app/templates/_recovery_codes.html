<h2>Коды восстановления</h2>
<p>Сохраните эти коды в надёжном месте — они <strong>показываются один раз</strong>.
  Каждый код срабатывает один раз: он заменяет код из письма или файл ключа при входе
  и код из письма при сбросе пароля.</p>
<ol id="recovery-codes">
  {% for code in recovery_codes %}<li><code>{{ code }}</code></li>{% endfor %}
</ol>
