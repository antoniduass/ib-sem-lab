{% extends "base.html" %}
{% block title %}Вход: код из письма{% endblock %}
{% block content %}
  <h1>Шаг 2 из 3: код из письма</h1>
  <p>Мы отправили 6-значный код на вашу почту. Код действует 10 минут.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Код
      <input name="code" required inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]{6}" maxlength="6">
    </label>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button>Продолжить</button>
  </form>
{% endblock %}
