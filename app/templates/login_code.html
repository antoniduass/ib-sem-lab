{% extends "base.html" %}
{% block title %}Вход: код из письма{% endblock %}
{% block content %}
  <h1>Шаг 2 из 3: код из письма</h1>
  <p>Мы отправили 6-значный код на вашу почту. Код действует 10 минут.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Код
      <input name="code" required autocomplete="one-time-code" maxlength="11">
      <span class="hint">Нет доступа к почте? Введите один из кодов восстановления
        (вида ABCDE-FGH23) — он заменит код из письма.</span>
    </label>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button>Продолжить</button>
  </form>
{% endblock %}
