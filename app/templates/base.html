<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Защищённый блокнот{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    a { color: #0b5cad; }
    form { display: grid; gap: 1rem; }
    label { display: grid; gap: .25rem; font-weight: 600; }
    input { font: inherit; padding: .5rem; border: 1px solid #8c959f; border-radius: 6px; }
    input:user-invalid { border-color: #cf222e; }
    .hint { font-weight: 400; font-size: .875rem; color: #59636e; }
    .error { font-weight: 400; font-size: .875rem; color: #cf222e; }
    button { font: inherit; padding: .6rem 1rem; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">Защищённый блокнот</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
